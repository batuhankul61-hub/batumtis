# Bu dosyayı config.yaml olarak kopyalayın ve kendi bilgilerinizi girin:
#   cp config.example.yaml config.yaml

profile:
  name: "Ad Soyad"
  email: "ornek@gmail.com"
  phone: "+90 5xx xxx xx xx"
  linkedin: "https://linkedin.com/in/kullanici"
  portfolio: ""
  # Ön yazıda kullanılacak kısa tanıtım (1-3 cümle)
  summary: >-
    I have 3 years of experience in customer support and data entry,
    and I am comfortable working remotely with tools like Slack, Jira and Google Workspace.
  cv_path: "cv.pdf"          # e-postaya eklenecek CV

# İlan kaynakları (hepsi herkese açık uzaktan iş siteleri)
sources: [remotive, remoteok, arbeitnow, jobicy, himalayas]

filters:
  # Bu kelimelerin geçtiği ilanlar puan alır (başlık 3, etiket 2, açıklama 1)
  keywords: [customer support, customer service, data entry, virtual assistant, turkish]
  # Hepsi ilanda geçmek zorunda (boş bırakılabilir)
  required_keywords: []
  # Başlık/etikette geçerse ilan elenir
  exclude_keywords: [senior, lead, principal, director, "10+ years"]
  # İlanın konum kısıtı bunlardan birini içermeli (boş liste = hepsi kabul)
  allowed_locations: [worldwide, anywhere, europe, emea, turkey, türkiye, global]
  min_score: 3

cover_letter_template: "templates/cover_letter_en.txt"
email_subject: "Application for $title - $name"

# E-posta ile başvuru ayarları (Gmail için "uygulama şifresi" gerekir)
smtp:
  host: "smtp.gmail.com"
  port: 587
  user: "ornek@gmail.com"
  password_env: "JOBBOT_SMTP_PASSWORD"   # şifre dosyaya değil, bu ortam değişkenine yazılır

daily_limit: 20              # günde en fazla kaç e-posta başvurusu
delay_seconds: [30, 90]      # başvurular arası rastgele bekleme

# --- LinkedIn / Indeed / Kariyer.net (tarayıcı ile) -------------------------
# Önce her site için bir kez giriş yapın:  python -m jobbot login linkedin
browser:
  sites: [linkedin, indeed, kariyer]      # istemediğinizi silin
  profile_dir: "browser_profile"          # oturumun saklandığı klasör
  headless: false                          # tarayıcıyı görünür çalıştır
  linkedin_location: "Türkiye"            # Türkiye'den çalışılabilen uzaktan işler
  indeed_domain: "tr.indeed.com"
  search_terms: []                         # boşsa filters.keywords kullanılır
  # İsterseniz sitede filtreleri seçip adres çubuğundaki linki buraya yapıştırın:
  search_urls:
    # kariyer: ["https://www.kariyer.net/is-ilanlari?kw=musteri%20temsilcisi&..."]
  max_pages: 2
  require_remote_text: true                # Indeed/Kariyer: ilan metninde "uzaktan/remote" yoksa atla
  daily_limit: {linkedin: 25, indeed: 15, kariyer: 20}
  delay_seconds: [20, 60]                  # başvurular arası bekleme
  # executable_path: "/usr/bin/chromium"   # gerekirse

# Başvuru formlarındaki sorular için cevaplar.
# Anahtar: soru metninde aranacak kelimeler ("|" ile alternatif), ilk eşleşen kullanılır.
# Cevabı bulunamayan zorunlu soru olursa başvuru yarıda bırakılır ve
# "elle başvurulacak" listesine eklenir — yanlış cevap gönderilmez.
answers:
  "phone|telefon|mobile": "+905xxxxxxxxx"
  "last name|surname|soyad": "Soyad"       # "soyadınız" "adınız"dan önce gelmeli
  "first name|adınız": "Ad"
  "email|e-posta": "ornek@gmail.com"
  "city|şehir|location|konum": "İstanbul"
  "linkedin": "https://linkedin.com/in/kullanici"
  "years of experience|how many years|kaç yıl|deneyim süre": "2"
  "english|ingilizce": "Professional"
  "authorized|legally|çalışma izni": "Yes"
  "sponsorship|vize": "No"
  "remote|uzaktan": "Yes"
  "salary|maaş|ücret beklenti": "30000"
  "notice period|ihbar|ne zaman başlay": "2 weeks"
  "agree|kabul|onaylıyorum|privacy|kvkk": "Yes"

database: "jobbot.db"
export:
  html: "basvurular.html"
  csv: "basvurular.csv"
